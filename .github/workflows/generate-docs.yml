name: Generate Docs

on:
  push:
    branches:
      - main
      - docs-ui
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build WebAssembly assets
        run: |
          docker compose -f wasm-examples/extras/docker-compose.yml \
            up --build --abort-on-container-exit --exit-code-from web-example

      - name: Tear down docker compose
        if: always()
        run: |
          docker compose -f wasm-examples/extras/docker-compose.yml down \
            --volumes --remove-orphans

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: wasm-examples/build/dist
          retention-days: 7

  build-web:
    runs-on: ubuntu-latest
    needs: build-wasm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: Install node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: docs
        run: pnpm install

      - name: Generate docs
        working-directory: docs
        run: pnpm build --preset github_pages
        env:
          NUXT_APP_BASE_URL: "/trueform/"

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.output/public

  deploy:
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write 

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4