name: Build Python packages

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Semver tag (e.g., v1.2.3)'
        required: true
        type: string

jobs:
  build-python:
    name: ${{ matrix.os }} Py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          #- ubuntu-latest
          #- macos-latest
          - windows-latest
        python-version:
          - '3.11'
          #- '3.12'
          #- '3.13'
          #- '3.14'
    env:
      BUILD_DIR: build/${{ matrix.os }}-py${{ matrix.python-version }}
      INSTALL_PREFIX: install/${{ matrix.os }}-py${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ninja

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PYTHON_BIN="$(python -c 'import sys; print(sys.executable)')"
          INSTALL_DIR="${GITHUB_WORKSPACE}/${INSTALL_PREFIX}"
          cmake -S . -B "${BUILD_DIR}" \
            -G Ninja \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_PYTHON=ON \
            -DPython_EXECUTABLE="${PYTHON_BIN}" \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        shell: pwsh
        run: |
          $python = python -c "import sys; print(sys.executable)"
          $installPrefix = Join-Path $env:GITHUB_WORKSPACE $env:INSTALL_PREFIX
          cmake -S . -B "$env:BUILD_DIR" `
            -G Ninja `
            -DCMAKE_C_COMPILER="clang-cl.exe" `
            -DCMAKE_CXX_COMPILER="clang-cl.exe" `
            -DBUILD_EXAMPLES=OFF `
            -DBUILD_PYTHON=ON `
            -DPython_EXECUTABLE="$python" `
            -DCMAKE_INSTALL_PREFIX="$installPrefix" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Python module (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake --build "${BUILD_DIR}" --target python --config Release

      - name: Build Python module (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build "$env:BUILD_DIR" --target python --config Release

      - name: Install project (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake --install "${BUILD_DIR}"

      - name: Install project (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --install "$env:BUILD_DIR" --config Release

      - name: Smoke test import (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          INSTALL_DIR="${GITHUB_WORKSPACE}/${INSTALL_PREFIX}"
          export PYTHONPATH="${INSTALL_DIR}${PYTHONPATH:+:$PYTHONPATH}"
          python -c "import trueform as tf; print('trueform bindings ready for', tf.__all__[0])"

      - name: Smoke test import (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installPrefix = Join-Path $env:GITHUB_WORKSPACE $env:INSTALL_PREFIX
          $env:PYTHONPATH = "$installPrefix" + [System.IO.Path]::PathSeparator + $env:PYTHONPATH
          python -c "import trueform as tf; print('trueform bindings ready for', tf.__all__[0])"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trueform-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ github.workspace }}/${{ env.INSTALL_PREFIX }}
          retention-days: 7
